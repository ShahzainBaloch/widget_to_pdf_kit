name: widget_to_pdf_kit
description: High-performance Flutter widget to PDF generator. Rasterizes onscreen or offscreen widgets into crisp, paginated PDF documents with custom formats and scaling.
version: 1.0.0
repository: https://github.com/ShahzainBaloch/widget_to_pdf_kit
issue_tracker: https://github.com/ShahzainBaloch/widget_to_pdf_kit/issues
topics:
  - pdf
  - printing
  - export
  - document
  - widgets

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  pdf: ">=3.10.0 <3.13.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
